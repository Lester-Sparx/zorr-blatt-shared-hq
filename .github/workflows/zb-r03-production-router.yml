name: zb-r03-production-router-legacy-retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy_retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Legacy R03 retirement notice
        shell: bash
        run: |
          set -euo pipefail
          echo "R03_LEGACY_AUTOMATION_RETIRED"
          echo "DUNCAN_CHATGPT_ORCHESTRATOR_ACTIVE"
          echo "PRODUCTION_ACTIVE=NO"
