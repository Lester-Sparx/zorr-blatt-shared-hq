name: babylon-r03-capture

on:
  pull_request:
    paths:
      - ".github/workflows/babylon-r03-capture.yml"
      - "experiments/directing-v1/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/directing-v1
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact verified B0 body artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Lester-Sparx/zorr-blatt-shared-hq/actions/artifacts/9593126818/zip > /tmp/b0.zip
          unzip -p /tmp/b0.zip b0-body.glb > public/oxihuman-b0-body.glb
          test "$(sha256sum public/oxihuman-b0-body.glb | cut -d' ' -f1)" = "626be02ae16ddf2bfd8760633761489a3c24f5b35d1e5b3f4a0c9a602cbffaf0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: experiments/directing-v1/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-r03-png-${{ github.sha }}
          path: |
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.png
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.babylon
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.manifest.json
          if-no-files-found: error
