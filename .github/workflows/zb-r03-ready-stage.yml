name: zb-r03-ready-stage

on:
  pull_request:
    paths:
      - '.github/workflows/zb-r03-ready-stage.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    if: >-
      github.actor == 'Lester-Sparx' &&
      github.event.pull_request.number == 134 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/r03-gh-aw-production-router'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark exact R03 implementation PR ready for merge gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const id = context.payload.pull_request.node_id;
            const result = await github.graphql(`
              mutation($id: ID!) {
                markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                  pullRequest { isDraft number }
                }
              }
            `, { id });
            const pr = result.markPullRequestReadyForReview.pullRequest;
            if (pr.number !== 134 || pr.isDraft !== false) {
              core.setFailed(`R03_READY_READBACK_FAILED:${JSON.stringify(pr)}`);
            }
