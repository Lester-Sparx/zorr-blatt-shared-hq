name: babylon-r03-capture

on:
  pull_request:
    paths:
      - ".github/workflows/babylon-r03-capture.yml"
      - "experiments/directing-v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/directing-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: experiments/directing-v1/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: babylon-r03-png-${{ github.sha }}
          path: |
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.png
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.babylon
            experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.manifest.json
          if-no-files-found: error
