name: zb-r03-gh-aw-compile

on:
  pull_request:
    paths:
      - '.github/workflows/zb-r03-lester-agent.md'
      - '.github/workflows/zb-r03-lester-agent.lock.yml'
      - '.github/workflows/zb-r03-gh-aw-compile.yml'
      - 'tests/test_zb_r03_gh_aw_source.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-gh-aw:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 136 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/r03-internal-dispatch-activation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/r03-internal-dispatch-activation
          fetch-depth: 0
      - name: Install exact gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/gh-aw"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64' \
            --output "$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          expected='b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e'
          test "$actual" = "$expected" || { echo "GH_AW_SHA256_MISMATCH:$actual" >&2; exit 1; }
          chmod 0555 "$asset"
          "$asset" --version
      - name: Compile R03 agentic workflow with strict mode
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile zb-r03-lester-agent --strict
          test -s .github/workflows/zb-r03-lester-agent.lock.yml
      - name: Commit only exact generated lock to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!.github/workflows/zb-r03-lester-agent.lock.yml' || { echo 'R03_SYNC_UNEXPECTED_DIFF' >&2; exit 1; }
          if git diff --quiet -- .github/workflows/zb-r03-lester-agent.lock.yml; then
            echo 'R03_SYNC_LOCK_ALREADY_EXACT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/zb-r03-lester-agent.lock.yml
          git commit -m 'build(r03): regenerate trusted internal dispatch lock'
          git push origin HEAD:fix/r03-internal-dispatch-activation
