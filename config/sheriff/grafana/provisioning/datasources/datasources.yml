apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: SHERIFF PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: sheriff
    secureJsonData:
      password: ${SHERIFF_DB_PASSWORD}
    jsonData:
      database: sheriff
      sslmode: disable
      postgresVersion: 1700
