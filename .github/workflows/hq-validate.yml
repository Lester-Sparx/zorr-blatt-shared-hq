name: hq-validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hq-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hq_validate.py
      - run: python3 -m unittest discover -s tests -v
  hq-scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_scope_guard.py' -v
  hq-control-tower-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable locked Control Tower release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p "$RUNNER_TEMP/control-tower"
          gh release download control-tower-v1-locked --pattern ZB_CONTROL_TOWER_v1_METADATA_BOUNDARY_LOCAL_FIX_QC.zip --dir "$RUNNER_TEMP/control-tower"
      - name: Verify exact pinned Control Tower bytes
        run: python3 scripts/hq_adapter.py verify-control-tower --artifact "$RUNNER_TEMP/control-tower/ZB_CONTROL_TOWER_v1_METADATA_BOUNDARY_LOCAL_FIX_QC.zip"
