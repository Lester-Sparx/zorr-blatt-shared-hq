name: hq-memory-test

on:
  pull_request:
    paths:
      - 'hq-memory/**'
      - 'agent-controller/**'
      - '.github/workflows/hq-memory-test.yml'
      - 'docs/superpowers/specs/2026-08-29-hq-memory-archive-mvp-r01-design.md'
      - 'docs/superpowers/plans/2026-08-29-hq-memory-archive-mvp-r01.md'
      - 'docs/superpowers/plans/2026-08-29-salvador-shadow-live-ingress-r01.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hq-memory/pyproject.toml
            agent-controller/pyproject.toml
      - name: Install production controller and HQ memory test dependencies
        run: python -m pip install -e './agent-controller' -e './hq-memory[test]'
      - name: Run HQ memory tests
        run: python -m pytest hq-memory/tests -q
      - name: Run production controller tests
        run: python -m pytest agent-controller/tests -q
      - name: Compile both packages
        run: python -m compileall -q hq-memory/src agent-controller/src
