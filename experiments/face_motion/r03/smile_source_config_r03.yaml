version: 3
source:
  path: "SOURCE.png"
  expected_size: [1086, 1448]
  sha256: "bd00c26373180a8678675dd9e7dc74a34c12899add8be246c82c6107b5f12d30"

animation:
  # Seven separate output frames, all sampled from frame 0.
  t_values: [0.0, 0.1666667, 0.3333333, 0.5, 0.6666667, 0.8333333, 1.0]
  easing: smootherstep

render:
  # Cubic is the production default here: it preserves the original line energy
  # materially better than linear while avoiding nearest-neighbor stair-stepping.
  interpolation: cubic

qc:
  max_displacement_px: 18.0
  min_jacobian_det: 0.18
  max_jacobian_det: 2.2
  max_control_step_px: 5.0
  max_control_accel_px: 2.5
  min_line_energy_ratio_inside: 0.82

regions:
  - name: mouth_smile_arc
    blend_mode: weighted_average
    rbf_sigma_px: 36
    regularization: 0.000001
    mask:
      type: ellipse
      center: [546, 583]
      axes: [112, 61]
      feather_inward_px: 10
    controls:
      - {id: mouth_corner_left,  semantic: mouthSmileLeft,  xy: [495, 579], delta_at_1: [-5, -15]}
      - {id: mouth_corner_right, semantic: mouthSmileRight, xy: [597, 579], delta_at_1: [ 5, -15]}
