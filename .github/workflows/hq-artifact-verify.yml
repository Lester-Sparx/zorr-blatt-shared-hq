name: hq-artifact-verify
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  hq-artifact-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.base.sha }}", path: base}
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", path: head}
      - name: Classify PR using protected-main code
        id: scope
        run: echo "artifact=$(PYTHONPATH=base/scripts python3 base/scripts/hq_pr_scope.py --base base --head head --kind artifact)" >> "$GITHUB_OUTPUT"
      - name: Resolve validated release tag using protected-main code
        if: steps.scope.outputs.artifact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(PYTHONPATH=base/scripts python3 base/scripts/hq_adapter.py release-tag --task head/hq/tasks/GITHUB_SHARED_HQ.json)"
          mkdir -p "$RUNNER_TEMP/hq-artifact"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/hq-artifact"
      - name: Require exactly one release asset to match registered SHA256
        if: steps.scope.outputs.artifact == 'true'
        run: PYTHONPATH=base/scripts python3 base/scripts/hq_adapter.py verify-release-directory --artifact-root "$RUNNER_TEMP/hq-artifact" --task head/hq/tasks/GITHUB_SHARED_HQ.json
      - name: Code-only PR has no artifact transition
        if: steps.scope.outputs.artifact == 'false'
        run: echo "CONTROL-PLANE CODE PR · ARTIFACT VERIFICATION NOT APPLICABLE"
