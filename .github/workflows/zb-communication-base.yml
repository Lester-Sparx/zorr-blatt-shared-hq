name: zb-communication-base-retired

# Compatibility trigger retained only so old repository/library tests can keep
# parsing this file while the legacy command surface is being retired.
# Issue #111 is closed and locked; this job is also hard-disabled below.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Legacy execution route is retired
        run: |
          echo "LEGACY_EXECUTION_ROUTE_RETIRED"
          echo "No GitHub comment may start the old LESTER/DUNCAN execution pipeline."
          echo "Use current issue #251 and direct GitHub + deterministic CI only."

# HISTORICAL_ONLY = issues: write
# HISTORICAL_ONLY = pull-requests: read
# HISTORICAL_ONLY = GITHUB_TOKEN: ${{ github.token }}
# HISTORICAL_ONLY = python3 scripts/zb_communication_base.py
