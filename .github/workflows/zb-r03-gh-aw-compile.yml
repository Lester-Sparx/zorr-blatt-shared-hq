name: zb-r03-gh-aw-compile

on:
  pull_request:
    paths:
      - '.github/workflows/zb-r03-lester-agent.md'
      - '.github/workflows/zb-r03-lester-agent.lock.yml'
      - '.github/workflows/zb-r03-gh-aw-compile.yml'
      - 'tests/test_zb_r03_gh_aw_source.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-gh-aw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Install exact gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/gh-aw"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64' \
            --output "$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          expected='b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e'
          test "$actual" = "$expected" || { echo "GH_AW_SHA256_MISMATCH:$actual" >&2; exit 1; }
          chmod 0555 "$asset"
          "$asset" --version
      - name: Compile R03 agentic workflow with strict mode
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile zb-r03-lester-agent --strict
          test -s .github/workflows/zb-r03-lester-agent.lock.yml
      - name: Sync exact compiler-generated lock to PR branch
        env:
          ZB_HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/zb-r03-lester-agent.lock.yml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/zb-r03-lester-agent.lock.yml
          git commit -m 'chore(r03): sync gh-aw generated lock'
          git push origin "HEAD:${ZB_HEAD_REF}"
      - name: Upload exact generated lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zb-r03-gh-aw-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/workflows/zb-r03-lester-agent.lock.yml
          retention-days: 7
          if-no-files-found: error
      - name: Verify committed lock matches pinned recompilation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows/zb-r03-lester-agent.lock.yml
