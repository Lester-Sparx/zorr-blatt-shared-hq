name: hq-dashboard
on:
  push:
    branches: [main]
    paths: ["hq/state/**", "hq/tasks/**", "hq/reviews/**", "hq/locks/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-read-only-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/hq_render_dashboard.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hq-status
          path: hq/dashboard/HQ_STATUS.md
