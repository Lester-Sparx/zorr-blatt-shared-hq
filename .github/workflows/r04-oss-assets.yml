name: R04 OSS assets

on:
  push:
    branches:
      - lester/babylon-cinematic-scene-r01
    paths:
      - .github/workflows/r04-oss-assets.yml
      - experiments/directing-v1/public/r04-oss-production-lock.json
      - experiments/directing-v1/public/cinematic-scene-r01.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned OSS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r04-assets
          curl --fail --location --retry 3 -o r04-assets/model-human.glb https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/12712269e576fd3ffb520ad6c6d45a8e265ea894/static/models/model-human.glb
          curl --fail --location --retry 3 -o r04-assets/rig-human.glb https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/12712269e576fd3ffb520ad6c6d45a8e265ea894/static/rigs/rig-human.glb
          curl --fail --location --retry 3 -o r04-assets/human-base-animations.glb https://raw.githubusercontent.com/Mesh2Motion/mesh2motion-app/12712269e576fd3ffb520ad6c6d45a8e265ea894/static/animations/human-base-animations.glb
          curl --fail --location --retry 3 -o r04-assets/sword.glb https://raw.githubusercontent.com/ilrein/warptracker/71bbfbdfacd118196994b26da68eec1876d55c6b/public/models/sword.glb
          curl --fail --location --retry 3 -o r04-assets/umram-human.glb https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/728f23ab5eb9d6cb2c8fb39acb3440bd81db0d3e/assets/human.glb
          curl --fail --location --retry 3 -o r04-assets/quaternius-superhero-male.glb https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/aa02a4e6d8337a0604d2da131bcbbeb1f01badf0/public/assets/vendor/quaternius/night-striker.glb
          curl --fail --location --retry 3 -o r04-assets/quaternius-ual.glb https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/aa02a4e6d8337a0604d2da131bcbbeb1f01badf0/public/assets/vendor/quaternius/universal-animation-library.glb

      - name: Verify pinned identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object r04-assets/model-human.glb)" = "3a317288be44f7bfa1cdd978214ba8541b2af0c5"
          test "$(git hash-object r04-assets/rig-human.glb)" = "832a222a611bd0ee9112c64145a3a49df9b89b3e"
          test "$(git hash-object r04-assets/human-base-animations.glb)" = "3c5b3258af3b982fb922bbc4008296ec4efa8814"
          test "$(git hash-object r04-assets/sword.glb)" = "d80d47cf6ac49ae72805ba992bccc2431dcfcbfc"
          test "$(git hash-object r04-assets/umram-human.glb)" = "de56d83cdcd5d741955fe6acd983a61e50e367c3"
          test "$(git hash-object r04-assets/quaternius-superhero-male.glb)" = "14697e33502e41ddbc1b7fdbf56bbf0478027700"
          test "$(git hash-object r04-assets/quaternius-ual.glb)" = "4fccf561b9b2ef73f611efe21981ef8739080065"
          file r04-assets/*.glb
          sha256sum r04-assets/*.glb | tee r04-assets/SHA256SUMS.txt

      - name: Upload verified OSS assets
        uses: actions/upload-artifact@v4
        with:
          name: r04-verified-oss-assets
          path: r04-assets/
          if-no-files-found: error
          retention-days: 30

  validate-upstream-character:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned OSS character runtime
        uses: actions/checkout@v4
        with:
          repository: Seyamalam/blood-league-kickoff
          ref: aa02a4e6d8337a0604d2da131bcbbeb1f01badf0

      - name: Use upstream Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.x
          cache: npm

      - name: Install pinned upstream dependencies
        run: npm ci

      - name: Run upstream character asset validator unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r04-upstream-validation
          node scripts/validate-character-assets.mjs --json | tee r04-upstream-validation/character-validation.json

      - name: Run upstream character runtime tests unchanged
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run src/render/objects/EnemyCharacterAssetPool.test.ts src/render/objects/CharacterAnimationController.test.ts | tee r04-upstream-validation/runtime-tests.txt

      - name: Upload upstream validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: r04-upstream-character-validation
          path: r04-upstream-validation/
          if-no-files-found: error
          retention-days: 30

  probe-girush-anime-body:
    runs-on: ubuntu-latest
    steps:
      - name: Download CC0 Girush slim anime humanoid archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r04-girush
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' -o r04-girush/girush.7z https://opengameart.org/sites/default/files/basemesh_a1_human_yw_by_girush_2.7z
          file r04-girush/girush.7z
          sha256sum r04-girush/girush.7z | tee r04-girush/SHA256SUMS.txt
          7z l r04-girush/girush.7z | tee r04-girush/CONTENTS.txt
          mkdir -p r04-girush/extracted
          7z x -y -or04-girush/extracted r04-girush/girush.7z >/dev/null
          find r04-girush/extracted -type f -printf '%P %s bytes\n' | sort | tee r04-girush/FILES.txt

      - name: Upload Girush probe
        uses: actions/upload-artifact@v4
        with:
          name: r04-girush-anime-body
          path: r04-girush/
          if-no-files-found: error
          retention-days: 30

  deliver-known-combat-png:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned Warptracker combat proof
        uses: actions/checkout@v4
        with:
          repository: ilrein/warptracker
          ref: 71bbfbdfacd118196994b26da68eec1876d55c6b
          sparse-checkout: |
            docs/media/combat.png
          sparse-checkout-cone-mode: false

      - name: Verify combat PNG
        shell: bash
        run: |
          set -euo pipefail
          file docs/media/combat.png
          sha256sum docs/media/combat.png

      - name: Upload combat PNG
        uses: actions/upload-artifact@v4
        with:
          name: r04-known-oss-combat-png
          path: docs/media/combat.png
          if-no-files-found: error
          retention-days: 30

  practice-directing-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout directing branch
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.x

      - name: Install pinned directing dependencies
        working-directory: experiments/directing-v1
        run: npm ci

      - name: Install Chromium for existing Playwright proof
        working-directory: experiments/directing-v1
        run: npx playwright install --with-deps chromium

      - name: Run existing Babylon browser proof unchanged
        working-directory: experiments/directing-v1
        run: npm run test:browser

      - name: Upload directing practice PNG
        uses: actions/upload-artifact@v4
        with:
          name: r04-directing-practice-png
          path: experiments/directing-v1/artifacts/zorr-cinematic-scene-r01.png
          if-no-files-found: error
          retention-days: 30
