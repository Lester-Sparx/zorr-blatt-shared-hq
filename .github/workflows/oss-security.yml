name: oss-security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foss-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-pinned actionlint v1.7.12 (MIT)
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$expected  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -version
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Install hash-pinned zizmor v1.29.0 (MIT)
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz'
          expected='dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839'
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/zizmor.tar.gz"
          echo "$expected  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zizmor"
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/zizmor" --version
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"

      - name: Install hash-pinned Gitleaks v8.30.1 (MIT)
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$expected  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Validate all GitHub Actions syntax with actionlint
        run: actionlint

      - name: Audit GitHub Actions security with zizmor
        run: zizmor --collect=workflows --min-severity high --min-confidence high .

      - name: Scan repository history for secrets with Gitleaks
        run: gitleaks git --redact --no-banner --verbose .
