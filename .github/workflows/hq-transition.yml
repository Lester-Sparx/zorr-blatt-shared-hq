name: hq-transition
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  hq-role-separation:
    runs-on: ubuntu-latest
    steps: &trusted-transition
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.event.pull_request.base.sha }}"
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          path: head
          persist-credentials: false
      - name: Classify PR using protected-main code
        id: scope
        run: echo "transition=$(PYTHONPATH=base/scripts python3 base/scripts/hq_pr_scope.py --base base --head head --kind transition)" >> "$GITHUB_OUTPUT"
      - name: Protected-main validator checks untrusted PR data
        if: steps.scope.outputs.transition == 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: PYTHONPATH=base/scripts python3 base/scripts/hq_transition_validate.py --base base --head head --base-sha "$GITHUB_BASE_SHA" --head-sha "$GITHUB_HEAD_SHA"
      - name: Control-plane code PR has no state-transition authority
        if: steps.scope.outputs.transition == 'false'
        run: echo "CONTROL-PLANE CODE PR · STATE TRANSITION NOT APPLICABLE"
  hq-revision-cas:
    runs-on: ubuntu-latest
    steps: *trusted-transition
  hq-review-binding:
    runs-on: ubuntu-latest
    steps: *trusted-transition
  hq-lock-eligibility:
    runs-on: ubuntu-latest
    steps: *trusted-transition

# pull_request_target executes this workflow definition and validator from
# protected base. Untrusted PR code is read as data and is never executed.
