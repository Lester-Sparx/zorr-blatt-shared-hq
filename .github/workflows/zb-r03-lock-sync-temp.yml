name: zb-r03-lock-sync-temp

on:
  push:
    branches:
      - fix/r03-copilot-default-model-selection

permissions:
  contents: write

jobs:
  sync-exact-generated-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/r03-copilot-default-model-selection
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source intent
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'model: copilot/auto' .github/workflows/zb-r03-lester-agent.md
          if grep -Fx 'model: auto' .github/workflows/zb-r03-lester-agent.md; then
            echo 'BARE_GH_AW_AUTO_FORBIDDEN' >&2
            exit 1
          fi
      - name: Install exact gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/gh-aw"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/github/gh-aw/releases/download/v0.86.2/linux-amd64' \
            --output "$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          expected='b8fd100d1d56a77b842ad28375ff361215a5aa1277db6b9a05d70054cde7260e'
          test "$actual" = "$expected" || { echo "GH_AW_SHA256_MISMATCH:$actual" >&2; exit 1; }
          chmod 0555 "$asset"
      - name: Compile exact lock and verify native Auto routing
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile zb-r03-lester-agent --strict
          lock=.github/workflows/zb-r03-lester-agent.lock.yml
          test -s "$lock"
          head -n 1 "$lock" | grep -F '"agent_model":"copilot/auto"'
          grep -F 'COPILOT_MODEL: copilot/auto' "$lock"
          if grep -Fxq '          COPILOT_MODEL: auto' "$lock"; then
            echo 'BARE_COPILOT_MODEL_AUTO_FORBIDDEN' >&2
            exit 1
          fi
      - name: Commit only exact generated lock when changed
        shell: bash
        env:
          BRANCH: fix/r03-copilot-default-model-selection
        run: |
          set -euo pipefail
          lock=.github/workflows/zb-r03-lester-agent.lock.yml
          if git diff --quiet -- "$lock"; then
            echo 'LOCK_ALREADY_EXACT=YES'
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = "$lock" || { echo "UNEXPECTED_DIFF:$changed" >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$lock"
          git commit -m 'build(r03): sync exact gh-aw generated lock'
          git push origin "HEAD:$BRANCH"
