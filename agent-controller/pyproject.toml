[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zb-local-agent-controller"
version = "0.0.1"
description = "Zero-budget local ZORR BLATT agent controller"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.13,<5",
]

[project.scripts]
zb = "zb_local_controller.console:main"
zb-reference-analyze = "zb_local_controller.reference_analysis:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
