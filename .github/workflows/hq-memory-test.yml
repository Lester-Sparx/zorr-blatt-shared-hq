name: hq-memory-test

on:
  pull_request:
    paths:
      - 'hq-memory/**'
      - 'agent-controller/**'
      - '.github/workflows/hq-memory-test.yml'
      - 'docs/superpowers/specs/2026-08-29-hq-memory-archive-mvp-r01-design.md'
      - 'docs/superpowers/plans/2026-08-29-hq-memory-archive-mvp-r01.md'
      - 'docs/superpowers/plans/2026-08-29-salvador-shadow-live-ingress-r01.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hq-memory/pyproject.toml
            agent-controller/pyproject.toml
      - name: Install production controller and HQ memory test dependencies
        run: python -m pip install -e './agent-controller' -e './hq-memory[test]'
      - name: Run HQ memory tests
        run: python -m pytest hq-memory/tests -q
      - name: Run production controller tests
        working-directory: agent-controller
        run: python -m pytest tests -q
      - name: Live read-only SALVADOR ingress smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from zb_hq_memory import ArchiveStore, build_salvador_context
          from zb_hq_memory.salvador_ingress import GitHubShadowReader, ingest_salvador_events

          expected_sha = "69f20660a52750eeafbc97877f0c064d008e8e3fa1ed25dcd005924bed5ec6bf"
          with tempfile.TemporaryDirectory() as tmp:
              store = ArchiveStore(Path(tmp))
              summary = ingest_salvador_events(
                  store,
                  GitHubShadowReader("Lester-Sparx/zorr-blatt-shared-hq"),
                  expected_actor="Lester-Sparx",
              )
              records = store.iter_records()
              proof = [
                  record
                  for record in records
                  if "ISSUE=72" in record.text
                  and "TASK_ID=ZB-SALVADOR-PROD-001" in record.text
                  and "STATE=RESULT_READY" in record.text
                  and expected_sha in record.text
              ]
              assert summary.events_archived >= 2, summary
              assert proof, "LIVE_ISSUE_72_RESULT_READY_NOT_ARCHIVED"
              assert build_salvador_context(store).skills == {}, "RUNTIME_EVENT_MUST_NOT_PROMOTE_QC_OR_SKILL"
              print(f"LIVE_SHADOW_INGRESS_PASS events={summary.events_archived} exact_issue72_result_ready={len(proof)}")
          PY
      - name: Compile both packages
        run: python -m compileall -q hq-memory/src agent-controller/src
